# Datenliste reparieren (Mondschein): Dateien, die im Release liegen, aber in daten.json fehlen (z. B. weil ein
# älterer Lauf sie beim Veröffentlichen verworfen hat), wieder aufnehmen. Lädt sie aus dem Release und
# veröffentlicht neu; gleiche Dateien werden nur ersetzt.
name: Datenliste reparieren

on:
  workflow_dispatch:
    inputs:
      muster:
        description: "Dateimuster im Release, z. B. mondschein-hoehen-puffer-*"
        default: "mondschein-hoehen-puffer-*"
      tag:
        description: "Release, aus dem die Dateien kommen (leer = neuester Datenstand)"
        default: ""
      lauf:
        description: "Optional: ID eines früheren Workflow-Laufs, dessen Artefakte mit veröffentlicht werden"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  reparieren:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      MUSTER: ${{ inputs.muster }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        if: ${{ inputs.lauf != '' }}
        with:
          run-id: ${{ inputs.lauf }}
          github-token: ${{ github.token }}
          path: daten
          merge-multiple: true
      - name: Dateien aus dem Release laden und neu veröffentlichen
        run: |
          # Ohne Angabe der neueste Datenstand (nicht das heutige Datum: nach Mitternacht UTC gibt es den noch nicht)
          tag="${TAG:-$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)}"
          mkdir -p daten
          gh release download "$tag" --repo ${{ github.repository }} --pattern "$MUSTER" --dir daten --skip-existing
          ls -la daten
          python3 wege/veroeffentlichen.py --daten daten --stand "$(date -u +%F)"
