# Erreichbarkeit und Durchsatz der Datenquellen prüfen (Mondschein, Gebietserweiterung E2). Ändert nichts.
name: Quellen sondieren

on:
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur ein Teil, z. B. dwd (DWD-Umstellung prüfen)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sondieren:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r wetter/requirements.txt
      - name: Quellen abfragen
        run: python3 sondierung/sondierung.py ${{ inputs.nur }}
